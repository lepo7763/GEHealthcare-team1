apiVersion: v1
kind: ResourceQuota
metadata:
  name: iomt-integration-quota
  namespace: iomt-integration
spec:
  hard:
    requests.cpu: "1"
    requests.memory: 1Gi
    limits.cpu: "2"
    limits.memory: 2Gi
    pods: "4"

---
apiVersion: v1
kind: LimitRange
metadata:
  name: iomt-integration-limits
  namespace: iomt-integration
spec:
  limits:
    - type: Container
      default:
        cpu: 500m
        memory: 1Gi
      defaultRequest:
        cpu: 100m
        memory: 256Mi
