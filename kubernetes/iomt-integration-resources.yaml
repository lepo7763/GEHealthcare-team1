apiVersion: v1
kind: ResourceQuota
metadata:
  name: iomt-integration-quota
  namespace: iomt-integration
spec:
  hard:
    requests.cpu: "500m"
    requests.memory: 512Mi
    limits.cpu: "1000m"
    limits.memory: 768Mi
    pods: "4"

---
apiVersion: v1
kind: LimitRange
metadata:
  name: iomt-integration-limits
  namespace: iomt-integration
spec:
  limits:
    - type: Container
      default:
        cpu: 250m
        memory: 192Mi
      defaultRequest:
        cpu: 50m
        memory: 64Mi
