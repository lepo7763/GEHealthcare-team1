apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: iomt-netshoot-job-manager
  namespace: iomt-integration
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "list", "delete"]

  - apiGroups: ["batch"]
    resources: ["jobs/status"]
    verbs: ["get"]

  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]

  # Allow GET-based exec for retrieving Netshoot archives.
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["get"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: iomt-netshoot-job-manager-binding
  namespace: iomt-integration
subjects:
  - kind: ServiceAccount
    name: iomt-network-backend
    namespace: iomt-integration
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: iomt-netshoot-job-manager

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: iomt-netshoot-pod-discovery
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["list"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: iomt-netshoot-pod-discovery-binding
subjects:
  - kind: ServiceAccount
    name: iomt-network-backend
    namespace: iomt-integration
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: iomt-netshoot-pod-discovery
