apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: iomt-netshoot-job-manager
  namespace: iomt-integration
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "list", "delete"]

  - apiGroups: ["batch"]
    resources: ["jobs/status"]
    verbs: ["get"]

  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: iomt-netshoot-job-manager-binding
  namespace: iomt-integration
subjects:
  - kind: ServiceAccount
    name: iomt-network-backend
    namespace: iomt-integration
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: iomt-netshoot-job-manager
