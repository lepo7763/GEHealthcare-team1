apiVersion: v1
kind: ServiceAccount
metadata:
  name: iomt-network-backend
  namespace: iomt-dev-1
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: network-pod-reader
  namespace: iomt-dev-1
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: network-pod-reader-binding
  namespace: iomt-dev-1
subjects:
  - kind: ServiceAccount
    name: iomt-network-backend
    namespace: iomt-dev-1
roleRef:
  kind: Role
  name: network-pod-reader
  apiGroup: rbac.authorization.k8s.io

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: tshark-capture-job-manager
  namespace: iomt-integration
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "delete"]
  - apiGroups: ["batch"]
    resources: ["jobs/status"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: tshark-capture-job-manager
  namespace: iomt-integration
subjects:
  - kind: ServiceAccount
    name: iomt-network-backend
    namespace: iomt-integration
roleRef:
  kind: Role
  name: tshark-capture-job-manager
  apiGroup: rbac.authorization.k8s.io
