# RBAC for the IoMT Analysis Tool backend when it runs inside the cluster.
#
# The backend already uses the iomt-network-backend ServiceAccount.  These
# rules let it:
#   - list pods and read container logs across all namespaces (container logs)
#   - create/read/delete the short-lived UMF RTI Job in iomt-integration
#   - read the UMF RTI QoS/SDDS/collector/license resources
#   - read the router Service in pm to validate the domain port
#
# Apply only if the backend runs in-cluster:
#   kubectl apply -f kubernetes/umf-rti-rbac.yaml
#
# The ClusterRole is intentionally read-only and limited to pods/pod logs.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: iomt-analysis-tool-cluster-reader
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: iomt-analysis-tool-cluster-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: iomt-analysis-tool-cluster-reader
subjects:
  - kind: ServiceAccount
    name: iomt-network-backend
    namespace: iomt-integration
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: iomt-analysis-tool-umf-rti
  namespace: iomt-integration
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "list", "watch", "delete"]
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["configmaps", "secrets"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: iomt-analysis-tool-umf-rti
  namespace: iomt-integration
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: iomt-analysis-tool-umf-rti
subjects:
  - kind: ServiceAccount
    name: iomt-network-backend
    namespace: iomt-integration
---
# The router Service lives in pm.  This is read-only and scoped to services.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: iomt-analysis-tool-router-reader
  namespace: pm
rules:
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: iomt-analysis-tool-router-reader
  namespace: pm
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: iomt-analysis-tool-router-reader
subjects:
  - kind: ServiceAccount
    name: iomt-network-backend
    namespace: iomt-integration
