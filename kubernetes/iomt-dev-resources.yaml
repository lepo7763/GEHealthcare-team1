apiVersion: v1
kind: ResourceQuota
metadata:
  name: iomt-dev-quota
spec:
  hard:
    requests.cpu: "200m"
    requests.memory: "128Mi"
    limits.cpu: "500m"
    limits.memory: "256Mi"
    pods: "2"

---
apiVersion: v1
kind: LimitRange
metadata:
  name: iomt-dev-limits
spec:
  limits:
    - type: Container
      default:
        cpu: "250m"
        memory: "128Mi"
      defaultRequest:
        cpu: "50m"
        memory: "64Mi"
